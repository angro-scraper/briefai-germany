services:
  - type: web
    name: briefai-germany-download
    runtime: static
    buildCommand: mkdir -p install-site/download install-site/admin && tar -xJf distribution/BriefAI-Germany-debug.tar.xz -C install-site/download && cp -R admin-panel/. install-site/admin/
    staticPublishPath: ./install-site
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
      - path: /admin/*
        name: Cache-Control
        value: no-store
      - path: /app/*
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /admin/*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.googleapis.com https://*.cloudfunctions.net https://*.firebaseio.com https://*.firebaseapp.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://www.google.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
