name: Publish BriefAI web bundle

on:
  push:
    branches: [main]
    paths-ignore:
      - 'install-site/app/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: briefai-web-bundle
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A stalled Flutter build must not block later content deployments indefinitely.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build web --release --base-href /app/

      - name: Replace the hosted web bundle
        run: |
          rm -rf install-site/app
          mkdir -p install-site/app
          cp -R build/web/. install-site/app/

      - name: Commit the generated bundle when it changed
        run: |
          if git diff --quiet -- install-site/app; then
            exit 0
          fi
          git config user.name 'briefai-release-bot'
          git config user.email 'briefai-release-bot@users.noreply.github.com'
          # Flutter may update more than one generated file under install-site.
          # Stage the complete generated site so Git starts the rebase cleanly.
          git add -A install-site
          git commit -m 'chore: publish current BriefAI web bundle'
          # Content commits can land while Flutter is building. Rebase the
          # generated bundle onto the current branch before writing it back.
          # --autostash also handles a late generated timestamp/manifest update.
          # Another publish run can change the generated bootstrap while this
          # build is running. During a rebase, "theirs" is this run's freshly
          # generated bundle, so prefer it instead of stopping on that artifact.
          git pull --rebase --autostash -X theirs origin main
          git push
