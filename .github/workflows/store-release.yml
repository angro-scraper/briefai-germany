name: Store release

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Semantic store version, for example 1.0.7
        required: true
        type: string
      build_number:
        description: Monotonically increasing Android build number
        required: true
        type: string

permissions:
  contents: read

jobs:
  android-app-bundle:
    name: Signed Android App Bundle
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restore signing and Firebase files
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          validate_keystore() {
            local candidate="$1"
            if keytool -list \
              -keystore "$candidate" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              cp "$candidate" android/briefai-release.jks
              return 0
            fi
            return 1
          }
          printf '%s' "$KEYSTORE" > /tmp/keystore-raw
          printf '%s' "$KEYSTORE" \
            | sed -e 's/^\"//' -e 's/\"$//' -e 's#^data:[^,]*,##' -e 'y#-_#+/#' \
            | base64 --decode --ignore-garbage > /tmp/keystore-once 2>/dev/null || true
          base64 --decode --ignore-garbage /tmp/keystore-once > /tmp/keystore-twice 2>/dev/null || true
          iconv -f UTF-16LE -t UTF-8 /tmp/keystore-once > /tmp/keystore-once-utf8 2>/dev/null || true
          base64 --decode --ignore-garbage /tmp/keystore-once-utf8 > /tmp/keystore-unicode 2>/dev/null || true
          validate_keystore /tmp/keystore-once \
            || validate_keystore /tmp/keystore-twice \
            || validate_keystore /tmp/keystore-unicode \
            || validate_keystore /tmp/keystore-raw \
            || { echo "ANDROID_KEYSTORE_BASE64 does not match the configured alias/password"; exit 1; }
          echo "Restored and validated Android signing keystore"
          printf 'storeFile=../briefai-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build signed AAB
        run: flutter build appbundle --release --flavor briefai --target lib/wrapper_main.dart --build-name=${{ inputs.build_name }} --build-number=${{ inputs.build_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: BriefAI-Germany-${{ inputs.build_name }}-${{ inputs.build_number }}.aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
