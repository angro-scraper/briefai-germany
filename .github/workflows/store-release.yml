name: Store release

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Semantic store version, for example 1.0.7
        required: true
        type: string
      build_number:
        description: Monotonically increasing Android build number
        required: true
        type: string

permissions:
  contents: read

jobs:
  android-app-bundle:
    name: Signed Android App Bundle
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restore signing and Firebase files
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$GOOGLE_SERVICES" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE" | base64 --decode > android/briefai-release.jks
          echo "$GOOGLE_SERVICES" | base64 --decode > android/app/google-services.json
          printf 'storeFile=../briefai-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build signed AAB
        run: flutter build appbundle --release --build-name=${{ inputs.build_name }} --build-number=${{ inputs.build_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: BriefAI-Germany-${{ inputs.build_name }}-${{ inputs.build_number }}.aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
