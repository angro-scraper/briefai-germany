name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      # Static landing pages and growth notes do not change the APK. The
      # web-bundle workflow has its own validation and publishes those files.
      - 'install-site/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Keep the Android CI toolchain reproducible. Flutter 3.50 introduced
          # deprecation infos that made the existing analyze step fail.
          flutter-version: '3.47.8'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test
      - run: node --check web/briefai_ocr.js
      - run: node --check web/briefai_native_store.js
      - run: node scripts/production-preflight.mjs --static
      - run: npm ci --prefix functions
      - run: npm run build --prefix functions
      - run: flutter build web --release --base-href /app/
      - uses: actions/upload-artifact@v4
        with:
          name: BriefAI-Germany-web
          path: build/web
      - run: >-
          flutter build apk --debug --flavor briefai
          --target lib/wrapper_main.dart
          --dart-define=SUBSCRIPTION_MANAGEMENT_URL=https://play.google.com/store/account/subscriptions?package=com.briefai.briefai_germany
      - uses: actions/upload-artifact@v4
        with:
          name: BriefAI-Germany-debug-apk
          # The BriefAI flavor prefixes the output filename.  Keeping this
          # explicit prevents the job from failing after a successful build.
          path: build/app/outputs/flutter-apk/app-briefai-debug.apk
