name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --debug --target lib/wrapper_main.dart
      - uses: actions/upload-artifact@v4
        with:
          name: BriefAI-Germany-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
