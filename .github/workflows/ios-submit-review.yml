name: iOS App Review submission

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: Existing App Store version
        required: true
        default: "1.0"
        type: string
      build_number:
        description: Processed TestFlight build to submit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: briefai-ios-app-review
  cancel-in-progress: false

jobs:
  submit:
    name: Submit BriefAI Germany to App Review
    runs-on: macos-26
    environment: ios-production
    timeout-minutes: 30
    env:
      BUNDLE_ID: com.briefai.briefaiGermany
    steps:
      - name: Verify required Apple secrets
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER_ID"
          test -n "$API_PRIVATE_KEY_BASE64"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Create temporary App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          PRIVATE_KEY=$(printf '%s' "$API_PRIVATE_KEY_BASE64" | base64 -D)
          jq -n \
            --arg key_id "$API_KEY_ID" \
            --arg issuer_id "$API_ISSUER_ID" \
            --arg key "$PRIVATE_KEY" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > "$RUNNER_TEMP/briefai-api-key.json"
          chmod 600 "$RUNNER_TEMP/briefai-api-key.json"

      - name: Submit processed build to App Review
        run: |
          set -euo pipefail
          fastlane deliver submit_build \
            --api_key_path "$RUNNER_TEMP/briefai-api-key.json" \
            --app_identifier "$BUNDLE_ID" \
            --app_version "${{ inputs.app_version }}" \
            --build_number "${{ inputs.build_number }}" \
            --platform ios \
            --submit_for_review true \
            --automatic_release true \
            --force true \
            --skip_binary_upload true \
            --skip_metadata true \
            --skip_screenshots true \
            --precheck_include_in_app_purchases false \
            --submission_information '{"export_compliance_uses_encryption":false}'

      - name: Clean temporary API key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/briefai-api-key.json"
