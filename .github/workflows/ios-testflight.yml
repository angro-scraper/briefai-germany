name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: App Store version, for example 1.0.22
        required: true
        default: 1.0.22
        type: string
      build_number:
        description: Unique App Store build number
        required: true
        default: "23"
        type: string
      upload_to_testflight:
        description: Upload the signed IPA to TestFlight
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: briefai-ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build signed IPA and upload to TestFlight
    runs-on: macos-15
    environment: ios-production
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.briefai.briefaiGermany
      ARCHIVE_PATH: build/ios/archive/Runner.xcarchive
      EXPORT_PATH: build/ios/ipa
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify required Apple secrets
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for value in \
            "$TEAM_ID" \
            "$API_KEY_ID" \
            "$API_ISSUER_ID" \
            "$API_PRIVATE_KEY_BASE64"; do
            test -n "$value"
          done

      - name: Install App Store Connect API key
        id: api_key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          API_KEYS_DIR="$RUNNER_TEMP/app-store-connect-keys"
          mkdir -p "$API_KEYS_DIR" "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$API_PRIVATE_KEY_BASE64" | base64 -D \
            > "$API_KEYS_DIR/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$API_KEYS_DIR/AuthKey_${API_KEY_ID}.p8"
          cp "$API_KEYS_DIR/AuthKey_${API_KEY_ID}.p8" \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          echo "path=$API_KEYS_DIR/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_OUTPUT"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Prepare Flutter iOS release
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --target lib/wrapper_main.dart \
            --build-name "${{ inputs.build_name }}" \
            --build-number "${{ inputs.build_number }}"

      - name: Archive signed iOS app
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_PATH: ${{ steps.api_key.outputs.path }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            archive

      - name: Export signed IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_PATH: ${{ steps.api_key.outputs.path }}
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BriefAI-Germany-iOS-${{ inputs.build_name }}-${{ inputs.build_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH=$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Clean temporary signing material
        if: ${{ always() }}
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          rm -f \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8" \
            "$RUNNER_TEMP/app-store-connect-keys/AuthKey_${API_KEY_ID}.p8"
