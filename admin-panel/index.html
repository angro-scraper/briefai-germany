<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BriefAI Admin</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <div><p class="eyebrow">BRIEFAI GERMANY</p><h1>Admin command center</h1></div>
        <button id="google-sign-in" type="button">Sign in with Google</button>
      </header>
      <section class="card sign-in-card">
        <h2>Administrator sign in</h2>
        <form id="email-sign-in">
          <label>Email<input id="admin-email" type="email" autocomplete="username" required /></label>
          <label>Password<input id="admin-password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">Sign in securely</button>
        </form>
        <button id="password-reset" class="secondary-action" type="button">Send password setup link</button>
      </section>
      <p id="status">Sign in with an account that has the Firebase admin claim.</p>
      <section class="metrics" aria-label="Current metrics">
        <article><span>Users</span><strong id="users">—</strong></article>
        <article><span>Active users</span><strong id="active-users">—</strong></article>
        <article><span>Analyses</span><strong id="analyses">—</strong></article>
        <article><span>Premium users</span><strong id="premium-users">—</strong></article>
        <article><span>Revenue</span><strong id="revenue">—</strong></article>
        <article><span>AI spend / limit</span><strong id="ai-spend">—</strong></article>
        <article><span>AI tokens</span><strong id="ai-tokens">—</strong></article>
        <article><span>AI model</span><strong id="ai-model">—</strong></article>
      </section>
      <section class="card">
        <h2>Send service notification</h2>
        <form id="notification-form">
          <label>Title<input id="title" maxlength="80" required /></label>
          <label>Message<textarea id="body" maxlength="240" required></textarea></label>
          <button type="submit">Send notification</button>
        </form>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
