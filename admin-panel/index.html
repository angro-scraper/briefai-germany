<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BriefAI Admin</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <div><p class="eyebrow">BRIEFAI GERMANY</p><h1>Admin command center</h1></div>
        <button id="sign-in">Sign in with Google</button>
      </header>
      <p id="status">Add your Firebase web configuration in <code>app.js</code> to connect this panel.</p>
      <section class="metrics" aria-label="Current metrics">
        <article><span>Users</span><strong id="users">—</strong></article>
        <article><span>Active users</span><strong id="active-users">—</strong></article>
        <article><span>Analyses</span><strong id="analyses">—</strong></article>
        <article><span>Premium users</span><strong id="premium-users">—</strong></article>
        <article><span>Revenue</span><strong id="revenue">—</strong></article>
      </section>
      <section class="card">
        <h2>Send service notification</h2>
        <form id="notification-form">
          <label>Title<input id="title" maxlength="80" required /></label>
          <label>Message<textarea id="body" maxlength="240" required></textarea></label>
          <button type="submit">Send notification</button>
        </form>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
